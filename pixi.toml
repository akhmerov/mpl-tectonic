[workspace]
name = "mpl-tectonic"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.15"
matplotlib = ">=3.11,<3.12"
tectonic = ">=0.15,<0.16"
pytest = ">=8,<9"
pypdf = ">=6,<7"
hatchling = ">=1.27,<2"
python-build = ">=1.3,<2"
pip = ">=25,<27"

[pypi-dependencies]
mpl-tectonic = { path = ".", editable = true }

[activation.env]
MPLCONFIGDIR = ".mplconfig"

[tasks]
build = "python -m build --no-isolation"
test-unit = "pytest -q"
test-artifacts = "python tests/test_installed_artifacts.py"
test = { depends-on = ["build", "test-unit", "test-artifacts"] }
