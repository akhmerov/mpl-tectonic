repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
        exclude: ^pixi\.lock$
