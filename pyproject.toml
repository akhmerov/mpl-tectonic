[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mpl-tectonic"
version = "0.1.2"
description = "Opt-in Tectonic support for Matplotlib's usetex mode"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Anton Akhmerov" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.11,<3.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/mpl_tectonic"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/.pre-commit-config.yaml",
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pixi.lock",
  "/pixi.toml",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.codespell]
skip = ".git,.pixi,.pytest_cache,.mplconfig,build,dist,pixi.lock"
ignore-words-list = "dvi,dvifont,dvipath,kpathsea,pdfname,texname,usetex,xdvfile"
