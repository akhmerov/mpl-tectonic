name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          frozen: true
      - name: Run pre-commit checks
        run: pixi run pre-commit
      - name: Build distributions once
        run: pixi run build
      - name: Build conda package
        run: pixi run build-conda
      - name: Test exact conda package
        run: pixi run test-conda-artifact
      - name: Test source installation
        run: pixi run test-unit
      - name: Test exact wheel and sdist
        run: pixi run test-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
