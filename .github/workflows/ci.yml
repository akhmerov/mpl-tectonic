name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: true
          frozen: true
      - name: Run pre-commit checks
        run: pixi run pre-commit
      - name: Build distributions once
        run: pixi run build
      - name: Build conda package
        run: pixi run build-conda
      - name: Test exact conda package
        run: pixi run test-conda-artifact
      - name: Test source installation
        run: pixi run test-unit
      - name: Test exact wheel and sdist
        run: pixi run test-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
