name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: true
          frozen: true
      - name: Run pre-commit checks
        run: pixi run pre-commit
      - name: Build distributions once
        run: pixi run build
      - name: Build conda package
        run: pixi run build-conda
      - name: Test exact conda package
        run: pixi run test-conda-artifact
      - name: Test source installation
        run: pixi run test-unit
      - name: Test exact wheel and sdist
        run: pixi run test-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
