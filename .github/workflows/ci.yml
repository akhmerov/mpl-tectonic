name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
          frozen: true
      - name: Run pre-commit checks
        run: pixi run pre-commit
      - name: Build distributions once
        run: pixi run build
      - name: Build conda package
        run: pixi run build-conda
      - name: Test exact conda package
        run: pixi run test-conda-artifact
      - name: Test source installation
        run: pixi run test-unit
      - name: Test exact wheel and sdist
        run: pixi run test-artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
